<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnos Sábado — Mantenimiento Akapol</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap');
:root{
  --bg:#f0ede8;--card:#fff;--tx:#1c1a17;--mu:#7a7570;--br:#dedad4;
  --ac:#c45c1a;--head:#1c1a17;--gn:#2e7d32;--gn2:#d4edda;
  --yl:#f59e0b;--yl2:#fef3c7;--rd:#c0392b;--rd2:#fdecea;
  --int:#2a6496;--int2:#d6eaf8;--pu:#7d4e9e;--pu2:#ead6f8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}

.hdr{background:var(--head);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.hdr-left .ey{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#e8956d;font-family:'Space Mono',monospace;margin-bottom:3px;}
.hdr-left h1{font-size:20px;font-weight:800;}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;}
.btn-ac{background:var(--ac);color:#fff;}
.btn-gn{background:var(--gn);color:#fff;}
.btn-out{background:transparent;border:1.5px solid #555;color:#ccc;}
.btn-sm{padding:6px 12px;font-size:11px;}

.tabs{display:flex;background:#fff;border-bottom:2px solid var(--br);padding:0 24px;overflow-x:auto;}
.tab{padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:'Inter',sans-serif;white-space:nowrap;}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);}
.pnl{display:none;padding:20px 24px;}
.pnl.on{display:block;}

.mes-nav{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.mes-nav h2{font-size:18px;font-weight:800;}
.mes-btn{background:var(--card);border:1.5px solid var(--br);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;}

.sab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.sab-card{background:var(--card);border-radius:12px;border:2px solid var(--br);overflow:hidden;}
.sab-hdr{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;background:#f5f3f0;}
.sab-hdr.ok{background:var(--gn2);}
.sab-hdr.par{background:var(--yl2);}
.sab-fecha{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.sab-body{padding:14px 16px;}

.turno-bloque{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--br);}
.turno-bloque:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.turno-tit{font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:6px;}
.turno-tit.man{color:var(--gn);}
.turno-tit.tar{color:var(--pu);}
.pers-min{font-size:11px;color:var(--tx);font-weight:600;line-height:1.7;}

.badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;}
.badge-mec{background:#dbeafe;color:#1e40af;}
.badge-elec{background:#fef3c7;color:#92400e;}
.badge-sup{background:var(--int2);color:var(--int);}
.badge-torn{background:#f3e8ff;color:#7c3aed;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:14px;width:440px;max-width:95vw;max-height:88vh;overflow-y:auto;}
.modal-hdr{background:var(--head);color:#fff;padding:13px 18px;border-radius:14px 14px 0 0;position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;}
.modal-hdr h3{font-size:14px;font-weight:800;}
.modal-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;}
.modal-body{padding:16px;}

.turno-sel{display:flex;gap:8px;margin-bottom:14px;}
.turno-sel-btn{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--br);background:var(--card);color:var(--mu);}
.turno-sel-btn.man.on{border-color:var(--gn);background:var(--gn2);color:var(--gn);}
.turno-sel-btn.tar.on{border-color:var(--pu);background:var(--pu2);color:var(--pu);}

.sec-tit{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.anotado-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--br);}
.anotado-item:last-child{border-bottom:none;}
.anotado-nom{font-size:13px;font-weight:700;}
.anotado-sub{font-size:11px;color:var(--mu);margin-top:1px;}
.btn-np{background:none;border:1.5px solid #fca5a5;color:var(--rd);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;}

.pers-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.pers-btn{border:1.5px solid var(--br);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--card);text-align:left;font-family:'Inter',sans-serif;}
.pers-btn:hover{border-color:var(--ac);}
.pers-btn.on{border-color:var(--gn);background:var(--gn2);}
.pers-btn.np{border-color:#fca5a5;background:var(--rd2);opacity:.6;cursor:not-allowed;}
.pers-btn-nom{font-size:12px;font-weight:700;}
.pers-btn-sub{font-size:10px;color:var(--mu);margin-top:2px;}

.hist-item{background:var(--card);border-radius:10px;border:1px solid var(--br);padding:14px 16px;margin-bottom:10px;}
.hist-fecha{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--ac);margin-bottom:8px;}
.hist-turno-tit{font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:4px;}
.hist-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.hist-tag{background:var(--bg);border:1px solid var(--br);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;}

.rank-item{background:var(--card);border-radius:10px;border:1px solid var(--br);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.rank-pos{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--mu);width:24px;}
.rank-nom{font-size:13px;font-weight:700;flex:1;}
.rank-sub{font-size:11px;color:var(--mu);margin-top:2px;}
.rank-bar{height:4px;background:var(--br);border-radius:2px;margin-top:4px;}
.rank-bar-fill{height:100%;background:var(--ac);border-radius:2px;}
.rank-cnt{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--ac);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gn);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

@media(max-width:600px){
  .hdr,.pnl{padding:14px 16px;}
  .sab-grid{grid-template-columns:1fr;}
  .pers-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
var SK='akapol_turnos_v4';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var T = {};
var TAREAS_TEC={};
var REEMPLAZOS={};
var EXTRAS={};  // {fecha: [leg1, leg2, ...]}
var CONFIRMADOS={};  // {fecha: [leg1, leg2, ...]}

// ═══ Conexión con Google Sheets (Fase 1: asignaciones, confirmaciones, no puede, extras) ═══
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJbHLWDEUWngg2jtIM0hl7kFwI7Vl7Cp8_z0PyBpDGkjVNMsjJJRC8IxLcc2-ZxvXQhA/exec';
var TURNOS_RAW = []; // filas crudas tal cual vienen de la planilla

function sincronizar(action, params){
  var payload = Object.assign({action: action}, params);
  fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)})
    .catch(function(err){ showToast('⚠️ No se pudo sincronizar con la planilla (sin conexión)'); });
}

function reconstruirEstadoDesdeSheet(){
  T = {};
  EXTRAS = {};
  CONFIRMADOS = {};
  TURNOS_RAW.forEach(function(row){
    var f = row.fecha, turno = row.turno, leg = row.leg;
    if(row.tipo === 'extra'){
      if(!EXTRAS[f]) EXTRAS[f]=[];
      if(EXTRAS[f].indexOf(leg)<0) EXTRAS[f].push(leg);
      return;
    }
    if(!T[f]) T[f]={man:{an:[],np:[]},tar:{an:[],np:[]}};
    if(!T[f][turno]) T[f][turno]={an:[],np:[]};
    if(row.noPuede){
      T[f][turno].np.push(leg);
    } else {
      T[f][turno].an.push({leg:leg, hs:row.hs, rol:row.rol});
    }
    if(row.confirmado){
      if(!CONFIRMADOS[f]) CONFIRMADOS[f]=[];
      if(CONFIRMADOS[f].indexOf(leg)<0) CONFIRMADOS[f].push(leg);
    }
  });
}

function cargarDesdeSheet(callback){
  fetch(APPS_SCRIPT_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){
      TURNOS_RAW = data.turnos || [];
      reconstruirEstadoDesdeSheet();
      if(callback) callback();
    })
    .catch(function(){
      showToast('⚠️ No se pudo conectar con la planilla — mostrando datos locales');
      if(callback) callback();
    });
}
var SUP_ACTIVO = null; // {nombre, rol}

var SUPERVISORES = [
  {pin:'1604', nombre:'Ibarra, Omar',   rol:'Supervisor Inted.'},
  {pin:'3072', nombre:'Reyn, Luciano',  rol:'Supervisor Mant.'},
  {pin:'3359', nombre:'Coronel, Matías',rol:'Supervisor Mant.'},
  {pin:'3354', nombre:'Diez, Cristian', rol:'Jefe de Mant.'}
];

var TAB_PEDIDO=1;
function pedirPinSup(tab){
  TAB_PEDIDO=(typeof tab==='number')?tab:1;
  if(SUP_ACTIVO){ goTab(TAB_PEDIDO); return; }
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:center;justify-content:center';
  d.innerHTML='<div style="background:#fff;border-radius:14px;padding:24px;width:300px;max-width:95vw;text-align:center">'+
    '<div style="font-size:22px;margin-bottom:8px">🔒</div>'+
    '<div style="font-size:15px;font-weight:800;margin-bottom:4px">Acceso supervisor</div>'+
    '<div style="font-size:12px;color:#7a7570;margin-bottom:16px">Ingresá tu PIN para ver el ranking</div>'+
    '<input type="password" id="pinInput" placeholder="PIN" maxlength="4" style="width:100%;padding:10px;border:1.5px solid #dedad4;border-radius:8px;font-size:20px;text-align:center;letter-spacing:.4em;margin-bottom:8px;box-sizing:border-box">'+
    '<div id="pinError" style="color:#c0392b;font-size:11px;margin-bottom:8px;display:none">PIN incorrecto</div>'+
    '<button onclick="validarPin()" style="width:100%;padding:11px;background:#9070c0;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px">Ingresar</button>'+
    '<button onclick="cerrarPinModal()" style="width:100%;padding:8px;background:none;border:1px solid #dedad4;border-radius:8px;font-size:12px;cursor:pointer">Cancelar</button>'+
  '</div>';
  document.body.appendChild(d);
  window._pinModal=d;
  document.getElementById('pinInput').focus();
  document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter') validarPin();});
}

function cerrarPinModal(){ if(window._pinModal) window._pinModal.remove(); }

function validarPin(){
  var pin=document.getElementById('pinInput').value.trim();
  var sup=SUPERVISORES.find(function(s){return s.pin===pin;});
  if(!sup){
    var pe=document.getElementById('pinError'); if(pe) pe.style.display='block';
    document.getElementById('pinInput').value='';
    document.getElementById('pinInput').focus();
    return;
  }
  SUP_ACTIVO=sup;
  if(window._pinModal) window._pinModal.remove();
  // Mostrar nombre y botón cerrar sesión
  var bs=document.getElementById('btnSup'); if(bs) bs.style.display='none';
  var bc=document.getElementById('btnCerrarSup'); if(bc) bc.style.display='inline-block';
  document.getElementById('btnCerrarSup').textContent='🔓 '+sup.nombre.split(',')[0]+' — Cerrar';
  var t2a=document.getElementById('tab1'); if(t2a) t2a.style.opacity='1';
  var t3a=document.getElementById('tab2'); if(t3a) t3a.style.opacity='1';
  goTab(TAB_PEDIDO);
}

function cerrarSesionSup(){
  SUP_ACTIVO=null;
  var bs2=document.getElementById('btnSup'); if(bs2) bs2.style.display='inline-block';
  var bc2=document.getElementById('btnCerrarSup'); if(bc2) bc2.style.display='none';
  var t2b=document.getElementById('tab1'); if(t2b) t2b.style.opacity='.45';
  var t3b=document.getElementById('tab2'); if(t3b) t3b.style.opacity='.45';
  goTab(0);
}

function load(){
  // T, EXTRAS y CONFIRMADOS ahora se traen de Google Sheets (ver cargarDesdeSheet).
  // TAREAS_TEC y REEMPLAZOS siguen guardándose en este navegador (fase 2 pendiente).
  try{
    var tt=localStorage.getItem(SK+'_tec');
    if(tt) TAREAS_TEC=JSON.parse(tt);
  }catch(e){}
  try{
    var rr=localStorage.getItem(SK+'_remp');
    if(rr) REEMPLAZOS=JSON.parse(rr);
  }catch(e){}
}
function save(){
  // T ya no se guarda acá — se sincroniza con Sheets en el momento de cada acción (ver sincronizar()).
  localStorage.setItem(SK+'_tec',JSON.stringify(TAREAS_TEC));
  localStorage.setItem(SK+'_remp',JSON.stringify(REEMPLAZOS));
}
function gp(leg){ return P.find(function(x){return x.leg===leg;})||null; }
function fiso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

// Parsear fecha ISO sin desfase de zona horaria
function parseFiso(s){
  var p=s.split('-');
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
function badge(puesto){
  var m={Mecanico:'badge-mec',Electricista:'badge-elec',Supervisor:'badge-sup',Tornero:'badge-torn'};
  return '<span class="badge '+(m[puesto]||'badge-mec')+'">'+puesto+'</span>';
}
function goTab(n){
  for(var i=0;i<3;i++){
    var tb=document.getElementById('tab'+i);
    var pl=document.getElementById('pnl'+i);
    if(tb) tb.className='tab'+(i===n?' on':'');
    if(pl) pl.className='pnl'+(i===n?' on':'');
  }
  if(n===1) renderRank();
  if(n===2) renderHorasExtra();
}
function accionCelda(f, leg, event, tipo){
  var p=gp(leg);
  if(!p) return;
  if(!T[f]) T[f]={man:{an:[],np:[]},tar:{an:[],np:[]}};
  var t=T[f];
  if(!t.man) t.man={an:[],np:[]};
  if(!t.tar) t.tar={an:[],np:[]};

  // Determinar tipo de celda clickeada
  tipo=tipo||event.currentTarget.getAttribute('data-tipo')||'';

  // Columna ✓ (vino/asignado) — toggle independiente
  if(tipo==='vino' || tipo==='vacio-v'){
    if(tipo==='vino'){
      // Quitar de asignados
      t.man.an=(t.man.an||[]).filter(function(item){return (typeof item==='object'?item.leg:item)!==leg;});
      t.tar.an=(t.tar.an||[]).filter(function(item){return (typeof item==='object'?item.leg:item)!==leg;});
    } else {
      // Agregar a asignados (NO quitar el NP — pueden coexistir)
      var yaEsta=false;
      (t.man.an||[]).forEach(function(item){if((typeof item==='object'?item.leg:item)===leg) yaEsta=true;});
      if(!yaEsta) t.man.an.push({leg:leg,hs:9,rol:'T'});
    }
    save(); renderMes(); return;
  }

  // Columna ✗ (no vino) — toggle independiente
  if(tipo==='no' || tipo==='vacio-n'){
    if(tipo==='no'){
      // Quitar NP
      t.man.np=(t.man.np||[]).filter(function(x){return x!==leg;});
      t.tar.np=(t.tar.np||[]).filter(function(x){return x!==leg;});
    } else {
      // Agregar NP (NO quita el asignado — pueden coexistir)
      if((t.man.np||[]).indexOf(leg)<0){
        if(!t.man.np) t.man.np=[];
        t.man.np.push(leg);
      }
    }
    save(); renderMes(); return;
  }

  // Columna ★ (extra) — toggle
  if(tipo==='extra' || tipo==='vacio-e'){
    if(!t.extra) t.extra=[];
    var idx=t.extra.indexOf(leg);
    if(idx>=0) t.extra.splice(idx,1);
    else t.extra.push(leg);
    save(); renderMes(); return;
  }
}

function cambiarMes(d){ mesAct+=d; if(mesAct>11){mesAct=0;anioAct++;} if(mesAct<0){mesAct=11;anioAct--;} renderMes(); }

function getSabs(){
  var sabs=[], dias=new Date(anioAct,mesAct+1,0).getDate();
  for(var d=1;d<=dias;d++){ var f=new Date(anioAct,mesAct,d); if(f.getDay()===6) sabs.push(fiso(f)); }
  return sabs;
}

    txt.innerHTML=t.done?'<s>'+esc(t.texto)+'</s>':esc(t.texto);
    var del=document.createElement('button');
    del.style.cssText='background:none;border:none;color:var(--mu);font-size:11px;cursor:pointer;margin-left:auto';
    del.textContent='✕';
    del.onclick=function(){eliminarTareaTec(leg,i);};
    row.appendChild(chk); row.appendChild(txt); row.appendChild(del);
    div.appendChild(row);
  });
}

function agregarTarea(leg){
  var inp=document.getElementById('inp-tarea-'+leg);
  if(!inp||!inp.value.trim()) return;
  if(!TAREAS_TEC[leg]) TAREAS_TEC[leg]=[];
  TAREAS_TEC[leg].push({texto:inp.value.trim(),done:false});
  inp.value='';
  save();
  renderListaTareas(leg);
}

function toggleTareaTec(leg,i){
  if(!TAREAS_TEC[leg]) return;
  TAREAS_TEC[leg][i].done=!TAREAS_TEC[leg][i].done;
  save();
  renderListaTareas(leg);
}

function eliminarTareaTec(leg,i){
  if(!TAREAS_TEC[leg]) return;
  TAREAS_TEC[leg].splice(i,1);
  save();
  renderListaTareas(leg);
}

function getSabAnterior(f){
  // Buscar el sábado inmediatamente anterior en T
  var d=parseFiso(f);
  var sabs=Object.keys(T).filter(function(k){return parseFiso(k)<d;}).sort();
  return sabs.length ? sabs[sabs.length-1] : null;
}

function getLegsEnSab(f){
  if(!f||!T[f]) return [];
  var legs=[];
  [(T[f].man||{}),(T[f].tar||{})].forEach(function(turno){
    (turno.an||[]).forEach(function(item){
      var leg=typeof item==='object'?item.leg:item;
      if(legs.indexOf(leg)===-1) legs.push(leg);
    });
  });
  return legs;
}

function abrirModal(f){
  fechaModal=f; turnoSel='man';
  var d=parseFiso(f);
  document.getElementById('modalTit').textContent='Sáb '+d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear();
  document.getElementById('btnMan').className='turno-sel-btn man on';
  document.getElementById('btnTar').className='turno-sel-btn tar';

  // Aviso sábado anterior
  var sabAnt=getSabAnterior(f);
  var legsAnt=sabAnt?getLegsEnSab(sabAnt):[];
  var avisoEl=document.getElementById('avisoSabAnt');
  if(avisoEl){
    if(legsAnt.length){
      var dAnt=parseFiso(sabAnt);
      avisoEl.textContent='⚠️ Personas que vinieron el sáb '+dAnt.getDate()+'/'+('0'+(dAnt.getMonth()+1)).slice(-2)+': '+legsAnt.map(function(l){var p=gp(l);return p?p.ap:'';}).join(', ');
      avisoEl.style.display='block';
    } else {
      avisoEl.style.display='none';
    }
  }
  window._legsAnt = legsAnt; // guardar para usar en renderModal

  renderModal();
  document.getElementById('modalBg').style.display='flex';
}

function selTurno(t){
  turnoSel=t;
  document.getElementById('btnMan').className='turno-sel-btn man'+(t==='man'?' on':'');
  document.getElementById('btnTar').className='turno-sel-btn tar'+(t==='tar'?' on':'');
  renderModal();
}

function getTurno(){
  if(!T[fechaModal]) T[fechaModal]={man:{an:[],np:[]},tar:{an:[],np:[]}};
  if(!T[fechaModal][turnoSel]) T[fechaModal][turnoSel]={an:[],np:[]};
  return T[fechaModal][turnoSel];
}

function renderModal(){
  var t=getTurno();
  var an=t.an||[], np=t.np||[];
  var turnoFiltro=turnoSel==='man'?'Mañana':'Tarde';

  document.getElementById('cntAn').textContent=an.length;

  // Anotados
  var listaAn=document.getElementById('listaAn');
  listaAn.innerHTML=an.length?an.map(function(item){
    var leg = typeof item==='object'?item.leg:item;
    var hs = typeof item==='object'?item.hs:9;
    var p=gp(leg); if(!p) return '';
    return '<div class="anotado-item">'+
      '<div><div class="anotado-nom">'+p.ap+', '+p.nom+' <span style="background:var(--ac);color:#fff;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px">'+hs+'hs</span></div>'+
      '<div class="anotado-sub">'+badge(p.puesto)+'</div></div>'+
      '<div style="display:flex;gap:6px">'+
        '<button onclick="cambiarHoras(\''+leg+'\')" style="background:none;border:1.5px solid var(--br);color:var(--mu);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer">'+(hs===9?'→12hs':'→9hs')+'</button>'+
        '<button class="btn-np" onclick="marcarNP(\''+leg+'\')">No puede →</button>'+
      '</div>'+
    '</div>';
  }).join(''):'<div style="font-size:12px;color:var(--mu)">Nadie anotado</div>';

  // Disponibles para anotarse (mismo turno, no anotados, no NP)
  var anLegsDisp = an.map(function(x){ return typeof x==='object'?x.leg:x; });
  var disp=P.filter(function(p){
    return p.puesto!=='Supervisor' && p.turno===turnoFiltro &&
           anLegsDisp.indexOf(p.leg)===-1 && np.indexOf(p.leg)===-1;
  });
  document.getElementById('listaDisp').innerHTML=disp.map(function(p){
    return '<button class="pers-btn" onclick="anotarse(\''+p.leg+'\')">'+
      '<div class="pers-btn-nom">'+p.ap+', '+p.nom+'</div>'+
      '<div class="pers-btn-sub">'+badge(p.puesto)+'</div>'+
    '</button>';
  }).join('')||'<div style="font-size:12px;color:var(--mu)">Todos del turno se anotaron</div>';

  // Asignación supervisor (todos del turno)
  var todos=P.filter(function(p){ return p.puesto!=='Supervisor'&&p.turno===turnoFiltro; });
  var anLegsCheck = an.map(function(x){ return typeof x==='object'?x.leg:x; });
  document.getElementById('listaAsig').innerHTML=todos.map(function(p){
    var isAn=anLegsCheck.indexOf(p.leg)!==-1, isNP=np.indexOf(p.leg)!==-1;
    return '<button class="pers-btn'+(isAn?' on':isNP?' np':'')+'" '+
      (isNP?'disabled':'')+' onclick="'+(isNP?'':isAn?'desanotar(\''+p.leg+'\')':'anotarse(\''+p.leg+'\')')+'">'+
      '<div class="pers-btn-nom">'+(isAn?'✓ ':isNP?'🔴 ':'')+p.ap+', '+p.nom+'</div>'+
      '<div class="pers-btn-sub">'+badge(p.puesto)+(isNP?' · No puede':'')+'</div>'+
    '</button>';
  }).join('');
}

function cambiarRol(leg){
  var t=getTurno();
  var item = t.an.find(function(x){ return (typeof x==='object'?x.leg:x)===leg; });
  if(!item) return;
  if(typeof item==='object') item.rol = item.rol==='T'?'S':'T';
  renderModal(); renderMes();
  sincronizar('cambiarRol', {fecha:fechaModal, turno:turnoSel, leg:leg, rol:item.rol});
}

function cambiarHoras(leg){
  var t=getTurno();
  var item = t.an.find(function(x){ return (typeof x==='object'?x.leg:x)===leg; });
  if(!item) return;
  if(typeof item==='object'){
    item.hs = item.hs===9 ? 12 : 9;
  }
  renderModal(); renderMes();
  sincronizar('cambiarHoras', {fecha:fechaModal, turno:turnoSel, leg:leg, hs:item.hs});
}

function anotarse(leg){
  var t=getTurno();
  if(getHoras(t,leg)!==null) return; // ya anotado
  abrirSelectorHoras(leg, function(hs){
    // Los primeros 4 son Titulares, el resto Suplentes
    var rol = t.an.length < 4 ? 'T' : 'S';
    t.an.push({leg:leg, hs:hs, rol:rol});
    renderModal(); renderMes(); showToast('✓ Anotado como '+(rol==='T'?'Titular':'Suplente')+' ('+hs+'hs)');
    sincronizar('anotarse', {fecha:fechaModal, turno:turnoSel, leg:leg, hs:hs, rol:rol, tipo:'base'});
  });
}

function getHoras(t, leg){
  var item = t.an.find(function(x){ return (typeof x==='object'?x.leg:x)===leg; });
  if(!item) return null;
  return typeof item==='object' ? item.hs : 9; // compatibilidad con datos viejos
}

function abrirSelectorHoras(leg, callback){
  var p = gp(leg);
  var d = document.createElement('div');
  d.className = 'modal-bg';
  d.style.zIndex = '300';
  d.innerHTML = '<div class="modal" style="width:300px">'+
    '<div class="modal-hdr"><h3>¿Cuántas horas?</h3></div>'+
    '<div class="modal-body" style="text-align:center">'+
      '<div style="font-size:13px;font-weight:700;margin-bottom:16px">'+(p?p.ap+', '+p.nom:'')+'</div>'+
      '<div style="display:flex;gap:10px;justify-content:center">'+
        '<button id="hs9" style="flex:1;padding:18px;border-radius:10px;border:2px solid var(--br);background:var(--card);font-size:18px;font-weight:800;cursor:pointer">9 hs</button>'+
        '<button id="hs12" style="flex:1;padding:18px;border-radius:10px;border:2px solid var(--br);background:var(--card);font-size:18px;font-weight:800;cursor:pointer">12 hs</button>'+
      '</div>'+
    '</div></div>';

  document.getElementById('hs12').onclick=function(){ d.remove(); callback(12); };
}
function desanotar(leg){
  var t=getTurno();
  t.an=t.an.filter(function(x){ return (typeof x==='object'?x.leg:x)!==leg; });
  renderModal(); renderMes();
  sincronizar('desanotarse', {fecha:fechaModal, turno:turnoSel, leg:leg});
}
function marcarNP(leg){
  var t=getTurno();
  // Sacar de anotados y agregar a no pueden — lugar queda libre
  t.an=t.an.filter(function(x){ return (typeof x==='object'?x.leg:x)!==leg; });
  if(t.np.indexOf(leg)===-1) t.np.push(leg);
  renderModal(); renderMes();
  showToast('⚠️ Lugar libre — esperando reemplazo');
  sincronizar('marcarNoPuede', {fecha:fechaModal, turno:turnoSel, leg:leg});
}

function cerrarModal(){
  document.getElementById('modalBg').style.display='none';

}

// ── HISTORIAL ──
function renderHist(){
  var body=document.getElementById('histBody');
  var fechas=Object.keys(T).filter(function(k){
    var t=T[k]; return (t.man&&t.man.an&&t.man.an.length)||(t.tar&&t.tar.an&&t.tar.an.length);
  }).sort();

  if(!fechas.length){
    body.innerHTML='<div style="text-align:center;padding:40px;color:var(--mu)">Sin turnos registrados</div>';
    return;
  }

  // Armar matriz: técnico → { fecha: {hs, turno} }
  var tecs = P.filter(function(p){ return p.puesto!=='Supervisor'; });
  var matriz = {};
  tecs.forEach(function(p){ matriz[p.leg]={}; });

  fechas.forEach(function(f){
    var t=T[f];
    [['M',(t.man&&t.man.an)||[]],['T',(t.tar&&t.tar.an)||[]]].forEach(function(par){
      par[1].forEach(function(item){
        var leg = typeof item==='object'?item.leg:item;
        var hs = typeof item==='object'?item.hs:9;
        var rol = typeof item==='object'?(item.rol||'T'):'T';
        if(!matriz[leg]) matriz[leg]={};
        if(matriz[leg][f]){
          matriz[leg][f].hs += hs;
          matriz[leg][f].turno += '+'+par[0];
          if(rol==='T') matriz[leg][f].rol='T'; // si fue titular en algún turno, prima T
        } else {
          matriz[leg][f] = {hs:hs, turno:par[0], rol:rol};
        }
      });
    });
  });

  // Solo mostrar técnicos que tienen al menos un registro
  var tecsConDatos = tecs.filter(function(p){ return Object.keys(matriz[p.leg]).length>0; });
  tecsConDatos.sort(function(a,b){
    var totA=Object.values(matriz[a.leg]).reduce(function(s,x){return s+x.hs;},0);
    var totB=Object.values(matriz[b.leg]).reduce(function(s,x){return s+x.hs;},0);
    return totB-totA;
  });

  if(!tecsConDatos.length){
    body.innerHTML='<div style="text-align:center;padding:40px;color:var(--mu)">Sin turnos registrados</div>';
    return;
  }

  // Construir tabla
  var html='<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:12px">';
  html+='<thead><tr style="background:var(--head)">';
  html+='<th style="position:sticky;left:0;background:var(--head);color:#fff;padding:9px 12px;text-align:left;font-size:11px;font-weight:700;z-index:2;min-width:160px">Técnico</th>';
  fechas.forEach(function(f){
    var d=new Date(f);
    html+='<th style="color:#fff;padding:9px 8px;text-align:center;font-size:10px;font-weight:700;white-space:nowrap;min-width:56px">'+d.getDate()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'</th>';
  });
  html+='<th style="background:var(--ac);color:#fff;padding:9px 12px;text-align:center;font-size:11px;font-weight:700;min-width:70px">TOTAL</th>';
  html+='</tr></thead><tbody>';

  tecsConDatos.forEach(function(p,idx){
    var bg = idx%2===0 ? '#fff' : '#faf9f7';
    html+='<tr style="background:'+bg+'">';
    html+='<td style="position:sticky;left:0;background:'+bg+';padding:8px 12px;font-weight:700;border-bottom:1px solid var(--br);z-index:1">'+p.ap+', '+p.nom+'<br><span style="font-size:10px;color:var(--mu);font-weight:400">'+badge(p.puesto)+'</span></td>';
    var totalHs=0, totalSab=0;
    fechas.forEach(function(f){
      var reg = matriz[p.leg][f];
      if(reg){
        totalHs += reg.hs; totalSab++;
        var colorTurno = reg.turno.indexOf('M')!==-1 && reg.turno.indexOf('T')!==-1 ? 'var(--ac)' : reg.turno==='M' ? 'var(--gn)' : 'var(--pu)';
        var rolTxt = reg.rol==='S'?'SUP':'TIT';
        var rolColor = reg.rol==='S'?'#2a6496':'#2e7d32';
        html+='<td style="text-align:center;padding:8px 4px;border-bottom:1px solid var(--br)">'+
          '<div style="font-weight:700;color:'+colorTurno+'">'+reg.hs+'hs</div>'+
          '<div style="font-size:9px;color:var(--mu)">'+(reg.turno==='M'?'Mañ':reg.turno==='T'?'Tar':'M+T')+'</div>'+
          '<div style="font-size:9px;font-weight:700;color:'+rolColor+'">'+rolTxt+'</div>'+
        '</td>';
      } else {
        html+='<td style="text-align:center;padding:8px 4px;border-bottom:1px solid var(--br);color:#ddd">—</td>';
      }
    });
    html+='<td style="text-align:center;padding:8px 12px;border-bottom:1px solid var(--br);background:#fdf6f2">'+
      '<div style="font-weight:800;color:var(--ac);font-size:14px">'+totalHs+'hs</div>'+
      '<div style="font-size:9px;color:var(--mu)">'+totalSab+' sáb.</div>'+
    '</td>';
    html+='</tr>';
  });

  html+='</tbody></table></div>';
  html+='<div style="margin-top:10px;font-size:11px;color:var(--mu)">Leyenda: <span style="color:var(--gn);font-weight:700">Mañ</span> = turno mañana · <span style="color:var(--pu);font-weight:700">Tar</span> = turno tarde · <span style="color:var(--ac);font-weight:700">M+T</span> = ambos turnos ese día</div>';

  body.innerHTML=html;
}

var FECHA_CORTE = new Date(2026, 6, 1); // desde julio 2026

function getConteo(){
  var c={};
  P.forEach(function(p){c[p.leg]=0;});
  Object.keys(T).forEach(function(f){
    var d=parseFiso(f);
    if(d < FECHA_CORTE) return; // ignorar antes de julio 2026
    var t=T[f];
    [(t.man||{}),(t.tar||{})].forEach(function(turno){
      (turno.an||[]).forEach(function(item){
        var leg = typeof item==='object'?item.leg:item;
        c[leg]=(c[leg]||0)+1;
      });
    });
  });
  return c;
}

function getHorasTotales(){
  var h={};
  P.forEach(function(p){h[p.leg]=0;});
  Object.keys(T).forEach(function(f){
    var d=parseFiso(f);
    if(d < FECHA_CORTE) return; // ignorar antes de julio 2026
    var t=T[f];
    [(t.man||{}),(t.tar||{})].forEach(function(turno){
      (turno.an||[]).forEach(function(item){
        var leg = typeof item==='object'?item.leg:item;
        var hs = typeof item==='object'?item.hs:9;
        h[leg]=(h[leg]||0)+hs;
      });
    });
  });
  return h;
}

function getMesesConDatos(){
  var MESES_NOM=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var set={};
  // Agregar meses de T_INICIAL (todos los sábados precargados)
  Object.keys(T_INICIAL).forEach(function(f){
    var d=parseFiso(f);
    var key=d.getFullYear()+'-'+d.getMonth();
    if(!set[key]) set[key]={mes:d.getMonth(),anio:d.getFullYear(),nom:MESES_NOM[d.getMonth()]+' '+d.getFullYear()};
  });
  // Agregar meses de T (datos guardados)
  Object.keys(T).forEach(function(f){
    var d=parseFiso(f);
    var key=d.getFullYear()+'-'+d.getMonth();
    if(!set[key]) set[key]={mes:d.getMonth(),anio:d.getFullYear(),nom:MESES_NOM[d.getMonth()]+' '+d.getFullYear()};
  });
  return Object.values(set).sort(function(a,b){return a.anio!==b.anio?a.anio-b.anio:a.mes-b.mes;});
}

function renderRank(){
  var body=document.getElementById('rankBody');

  var set={};
  Object.keys(T_INICIAL).forEach(function(f){
    var d=parseFiso(f);
    var key=d.getFullYear()+'-'+d.getMonth();
    if(!set[key]) set[key]={mes:d.getMonth(),anio:d.getFullYear(),nom:MESES_NOM[d.getMonth()]+' '+d.getFullYear()};
  });
  var meses=Object.values(set).sort(function(a,b){return a.anio!==b.anio?a.anio-b.anio:a.mes-b.mes;});

    return '<option value="'+m.mes+'|'+m.anio+'"'+(m.mes===ahora.getMonth()&&m.anio===ahora.getFullYear()?' selected':'')+'>'+m.nom+'</option>';

  body.innerHTML=

function renderRankMes(){

  if(!body) return;

  var ahora=new Date();
  var selEl=document.getElementById('rankMesSel');

  if(selEl&&selEl.value){var sp=selEl.value.split('|');mesBase=parseInt(sp[0]);anioBase=parseInt(sp[1]);}
  else{mesBase=ahora.getMonth();anioBase=ahora.getFullYear();}
  var mesSig=(mesBase+1)%12,anioSig=mesBase===11?anioBase+1:anioBase;

  var MESES_NOM=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function getSabsMes(mes,anio){
    var sabs=[],dias=new Date(anio,mes+1,0).getDate();
    for(var d=1;d<=dias;d++){var fd=new Date(anio,mes,d);if(fd.getDay()===6)sabs.push(fiso(fd));}
    return sabs;
  }

  var sabsAct=getSabsMes(mesBase,anioBase);

  var todosLosSabs=sabsAct.concat(sabsSig);

  var iconPuesto={'Mecánico':'🔩','Electricista':'⚡','Tornero':'🔧'};
  var grupos={};
  P.forEach(function(p){
    if(p.puesto==='Supervisor') return;
    if(!grupos[p.puesto]) grupos[p.puesto]=[];
    grupos[p.puesto].push(p);
  });

  var colspan=3+todosLosSabs.length*3;

  var leyenda='<div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap">'+
    '<span style="font-size:11px;font-weight:700;color:#2e7d32">✓ Tenía que venir</span>'+
    '<span style="font-size:11px;font-weight:700;color:#c0392b">✗ No vino</span>'+
    '<span style="font-size:11px;font-weight:700;color:#1565c0">↔ No le tocaba pero vino</span>'+
  '</div>';

  var html=leyenda+'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">';

  // Fila 0: meses
  html+='<thead><tr style="background:var(--head)"><th rowspan="3" style="text-align:left;padding:8px 8px;color:#fff;font-weight:700;min-width:110px;max-width:130px">Técnico</th>';
  if(sabsAct.length) html+='<th colspan="'+(sabsAct.length*3)+'" style="text-align:center;padding:5px;background:#1c1a17;color:#f59e0b;border:0.5px solid #333;font-weight:700;font-size:11px">'+MESES_NOM[mesBase]+' '+anioBase+'</th>';

function importarExcelHorasExtra(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result, {type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      var headerIdx=-1;
      for(var i=0;i<rows.length;i++){
        if(rows[i] && String(rows[i][0]||'').trim()==='Legajo'){ headerIdx=i; break; }
      }
      if(headerIdx<0){ showToast('⚠️ No encontré la fila de encabezado "Legajo" en el Excel'); return; }
      var out=[];
      for(var j=headerIdx+1;j<rows.length;j++){
        var r=rows[j];
        if(!r || r[0]===null || r[0]==='') continue;
        var nom=r[1];
        if(nom===null || nom===undefined || String(nom).trim()==='') continue;
        var meses=[];
        for(var m=0;m<12;m++){ meses.push(Number(r[2+m])||0); }
        var total=Number(r[14])||0, maxm=Number(r[15])||0;
        var disp=(r[16]===null||r[16]===undefined)?0:Number(r[16])||0;
        var estado=r[17]||'';
        out.push([r[0], nom, meses, total, maxm, disp, estado]);
      }
      if(!out.length){ showToast('⚠️ No encontré filas de colaboradores debajo del encabezado'); return; }
      var hoy=new Date();
      var fecha=('0'+hoy.getDate()).slice(-2)+'/'+('0'+(hoy.getMonth()+1)).slice(-2)+'/'+hoy.getFullYear();
      HORAS_EXTRA=out; HORAS_EXTRA_CORTE=fecha;
      guardarHorasExtra(out, fecha);
      renderHorasExtra();
      showToast('✓ Horas extra actualizadas — '+out.length+' colaboradores');
    }catch(err){
      showToast('⚠️ No pude leer ese Excel — revisá que sea el mismo formato');
    }
  };
  reader.readAsArrayBuffer(file);
}

    '<div style="font-size:22px;margin-bottom:8px;text-align:center">📁</div>'+
    '<div style="font-size:15px;font-weight:800;text-align:center;margin-bottom:12px">Descargar turnos '+nombreMes+'</div>'+
    '<div style="background:#f0ede8;border-radius:8px;padding:12px 14px;margin-bottom:16px">'+
      '<div style="font-size:11px;font-weight:700;color:#7a7570;text-transform:uppercase;margin-bottom:6px">Guardar en:</div>'+
      '<div style="font-family:monospace;font-size:12px;font-weight:700;color:#c45c1a;word-break:break-all">'+carpeta+'</div>'+
    '</div>'+
    '<div style="font-size:12px;color:#7a7570;margin-bottom:16px;line-height:1.5">Cuando el navegador pregunte dónde guardar, navegá a esa carpeta y hacé click en <strong>Guardar</strong>.</div>'+
    '<button id="btnDescOk" style="width:100%;padding:12px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">Entendido — descargar ahora</button>'+
  '</div>';
  document.body.appendChild(div);

  document.getElementById('btnDescOk').onclick=function(){
    div.remove();
    var ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:12},{wch:10},{wch:20},{wch:14},{wch:12},{wch:10},{wch:10},{wch:8}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Turnos '+nombreMes+' '+anio);
    XLSX.writeFile(wb,'Turnos_Sabado_'+nombreMes+'_'+anio+'.xlsx');
  };
}

var _t;
function showToast(msg){
  if(_t) clearTimeout(_t);
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show';
  _t=setTimeout(function(){el.className='toast';},2200);
}

load();
cargarHorasExtraGuardadas();
renderMes();
cargarDesdeSheet(function(){ renderMes(); });
setInterval(function(){ cargarDesdeSheet(function(){
  // Sólo re-renderiza si estamos en la solapa de sábados y no hay un modal abierto (para no interrumpir a alguien editando)
  if(document.getElementById('modalBg').style.display!=='flex') renderMes();
}); }, 20000);
</script>
